<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>ShimiRide — מכשירים</title>
<style>
:root{--bg:#0b1220;--card:#141d2e;--line:#243149;--txt:#e8eefc;--dim:#8b9bb4;--green:#4ecb8f;--red:#e2604a;--gold:#e8b84b}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,sans-serif;padding:16px 14px 30px;font-size:15px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
h1{font-size:18px}
.sub{color:var(--dim);font-size:12.5px;margin-bottom:14px}
.dev{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:10px}
.dev.off{opacity:.62}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.nm{font-weight:700;font-size:15.5px}
.id{font-size:11.5px;color:var(--dim);font-family:ui-monospace,monospace;margin-top:3px}
.badge{font-size:11px;padding:3px 9px;border-radius:7px;font-weight:700;white-space:nowrap}
.badge.on{background:#12301f;color:var(--green);border:1px solid #1f4436}
.badge.of{background:#2a1a18;color:var(--red);border:1px solid #4a2a26}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.cell{background:#0e1626;border:1px solid var(--line);border-radius:9px;padding:9px 11px;display:flex;justify-content:space-between;font-size:13px}
.cell b{font-weight:700}
.ok{color:var(--green)} .no{color:var(--red)} .warn{color:var(--gold)}
.bar{height:6px;border-radius:4px;background:#0e1626;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#4ecb8f,#2f9e6a)}
.bar i.low{background:linear-gradient(90deg,#e8b84b,#c98f1f)}
.bar i.crit{background:linear-gradient(90deg,#e2604a,#b8432f)}
.empty{background:#152036;border:1px solid var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--dim);font-size:13.5px;line-height:1.7}
.stamp{font-size:11px;color:var(--dim)}
</style>
</head>
<body>
<header><h1>מכשירי ShimiRide</h1><span class="stamp" id="stamp"></span></header>
<div class="sub" id="sub">טוען…</div>
<div id="list"></div>

<script>
(() => {
'use strict';
const API='https://base44.app/api/apps/6a901f55a4d9a9b76a095a77/functions/ridePing';
const KEY=localStorage.getItem('bank_key')||'';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function ago(m){
  if(m===null) return 'לא דיווח מעולם';
  if(m<1) return 'עכשיו';
  if(m<60) return 'לפני '+m+' דק׳';
  const h=Math.floor(m/60);
  if(h<24) return 'לפני '+h+' שע׳';
  return 'לפני '+Math.floor(h/24)+' ימים';
}
const flag=v=>v===true?'<span class="ok">פעיל</span>':(v===false?'<span class="no">כבוי</span>':'<span style="color:var(--dim)">לא ידוע</span>');

async function load(){
  if(!KEY){ $('#list').innerHTML='<div class="empty">נדרש מפתח גישה. פתחו את דף הבנק, הזינו מפתח, וחזרו לכאן.</div>'; $('#sub').textContent=''; return; }
  try{
    const r=await fetch(API+'?action=list&key='+encodeURIComponent(KEY),{headers:{'x-waba-key':KEY}});
    const d=await r.json();
    if(!d.ok){ $('#list').innerHTML='<div class="empty">שגיאה: '+esc(d.error||'')+'</div>'; return; }
    $('#sub').textContent = d.count===0 ? 'אין מכשירים מדווחים' : `${d.count} מכשירים · ${d.online} מחוברים כרגע`;
    $('#stamp').textContent=new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
    if(d.count===0){
      $('#list').innerHTML='<div class="empty">עוד לא הגיעה פעימה משום מכשיר.<br>ברגע שאפליקציית ShimiRide תשלח דיווח, הוא יופיע כאן עם סוללה, טעינה, מיקרופון ומצלמה.</div>';
      return;
    }
    $('#list').innerHTML=d.devices.map(x=>{
      const b=x.battery;
      const cls=b===null||b===undefined?'':(b<=15?'crit':(b<=35?'low':''));
      return `<div class="dev ${x.online?'':'off'}">
        <div class="top">
          <div><div class="nm">${esc(x.name||x.devid)}</div><div class="id">${esc(x.devid)}${x.app_version?' · גרסה '+esc(x.app_version):''}</div></div>
          <span class="badge ${x.online?'on':'of'}">${x.online?'מחובר':'לא מחובר'}</span>
        </div>
        ${b!==null&&b!==undefined?`<div class="bar"><i class="${cls}" style="width:${b}%"></i></div>`:''}
        <div class="grid">
          <div class="cell"><span>סוללה</span><b class="${cls==='crit'?'no':(cls==='low'?'warn':'')}">${b!==null&&b!==undefined?b+'%':'—'}</b></div>
          <div class="cell"><span>טעינה</span><b>${x.charging===true?'בטעינה':(x.charging===false?'לא':'—')}</b></div>
          <div class="cell"><span>מיקרופון</span><b>${flag(x.mic)}</b></div>
          <div class="cell"><span>מצלמה</span><b>${flag(x.camera)}</b></div>
          <div class="cell"><span>מיקום</span><b>${flag(x.location)}</b></div>
          <div class="cell"><span>דיווח אחרון</span><b style="font-size:12px">${ago(x.age_min)}</b></div>
        </div>
      </div>`;
    }).join('');
  }catch(e){ $('#list').innerHTML='<div class="empty">שגיאת רשת</div>'; }
}

load();
setInterval(load, 20000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) load(); });
})();
</script>
</body>
</html>
