<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>שימי מרכזיה · מעבר</title>
<meta name="robots" content="noindex"/>
<meta http-equiv="refresh" content="0; url=https://my.shimi.land/merkazia/"/>
<style>
:root{--bg:#08080A;--gold:#FFB800;--tx:#F4F1EA;--mut:#9A968C}
*{box-sizing:border-box}
body{margin:0;height:100dvh;display:flex;align-items:center;justify-content:center;
 background:radial-gradient(900px 420px at 85% -10%,rgba(242,101,34,.10),transparent 60%),var(--bg);
 color:var(--tx);font-family:'Heebo','Rubik',system-ui,Arial,sans-serif;text-align:center;padding:24px}
.card{max-width:420px}
h1{font-size:20px;margin:0 0 8px;background:linear-gradient(90deg,var(--gold),#D4AF37);-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:var(--mut);font-size:14px;line-height:1.6;margin:0 0 18px}
a{display:inline-block;background:#F26522;color:#fff;text-decoration:none;font-weight:700;
 padding:12px 20px;border-radius:12px;box-shadow:0 4px 14px rgba(242,101,34,.35)}
small{display:block;color:#6c6a64;font-size:12px;margin-top:16px}
</style>
</head>
<body>
<div class="card">
  <h1>המרכזיה אוחדה</h1>
  <p>כל 18 קווי הרשת, הקריאה והשליחה והתבניות — במקום אחד. מעבירים אותך למרכזיה של שימי ראשי.</p>
  <a href="https://my.shimi.land/merkazia/">פתיחת המרכזיה</a>
  <small>אם לא עברת אוטומטית, לחץ על הכפתור.</small>
</div>
<script>location.replace('https://my.shimi.land/merkazia/');</script>
</body>
</html>
