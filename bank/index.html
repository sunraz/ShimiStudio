<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07070b">
<title>בנק הרשת · שימי</title>
<style>
:root{
--bg:#07070b; --bg2:#0c0d13; --card:rgba(255,255,255,.035); --card2:rgba(255,255,255,.055);
--line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.14);
--txt:#f2f3f7; --dim:#8d90a1; --dim2:#5f6273;
--gold:#e5c072; --gold2:#f6dfa4; --green:#3ddc97; --red:#ff6b5e; --blue:#6aa8ff; --violet:#a98bff;
--r:20px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
background:
 radial-gradient(1100px 620px at 88% -12%,rgba(229,192,114,.16),transparent 62%),
 radial-gradient(820px 520px at 4% 6%,rgba(106,168,255,.10),transparent 60%),
 linear-gradient(180deg,#07070b 0%,#0a0b11 52%,#07070b 100%);
color:var(--txt);font-family:-apple-system,"Segoe UI",system-ui,"Heebo",Arial,sans-serif;
font-size:14.5px;line-height:1.55;padding-bottom:96px;min-height:100%;
-webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* ── header ── */
header.top{position:sticky;top:0;z-index:40;backdrop-filter:blur(18px);
 background:linear-gradient(180deg,rgba(7,7,11,.92),rgba(7,7,11,.62));border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:12px;padding:14px 16px;max-width:1180px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.seal{width:38px;height:38px;border-radius:12px;flex:0 0 auto;
 background:linear-gradient(145deg,#f6dfa4,#c99f4d 62%,#8c6a26);
 display:grid;place-items:center;color:#241a06;font-weight:800;font-size:16px;
 box-shadow:0 6px 18px rgba(229,192,114,.28),inset 0 1px 0 rgba(255,255,255,.55)}
.brand b{font-size:16px;letter-spacing:.2px;display:block;line-height:1.15}
.brand span{font-size:11.5px;color:var(--dim2);letter-spacing:.4px}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--dim);
 border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:var(--card);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(61,220,151,.15)}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);
 color:var(--txt);display:grid;place-items:center;cursor:pointer;transition:.18s;font-size:16px}
.iconbtn:active{transform:scale(.94);background:var(--card2)}
.iconbtn.busy{pointer-events:none;opacity:.55}
.spin{animation:sp .9s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── hero ── */
.hero{padding:22px 0 6px}
.eyebrow{font-size:11.5px;letter-spacing:2.4px;color:var(--gold);text-transform:uppercase;font-weight:700;margin-bottom:8px}
h1{font-size:26px;font-weight:800;letter-spacing:-.4px;line-height:1.2}
h1 em{font-style:normal;background:linear-gradient(100deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--dim);font-size:13px;margin-top:6px}

/* ── kpi ── */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
.kpi{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:var(--r);padding:15px 15px 13px;
 background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.015));}
.kpi:after{content:"";position:absolute;inset:0;background:radial-gradient(220px 120px at 100% 0%,rgba(229,192,114,.14),transparent 70%);pointer-events:none}
.kpi .lbl{font-size:11.5px;color:var(--dim);letter-spacing:.3px;margin-bottom:7px;display:flex;gap:6px;align-items:center}
.kpi .val{font-size:23px;font-weight:800;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:12px;font-weight:600;color:var(--dim);margin-inline-start:3px}
.kpi .foot{font-size:11.5px;color:var(--dim2);margin-top:5px}
.up{color:var(--green)} .down{color:var(--red)}

/* ── tabs ── */
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:20px 0 4px;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--dim);
 border-radius:999px;padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s;white-space:nowrap}
.tab.on{background:linear-gradient(150deg,rgba(229,192,114,.22),rgba(229,192,114,.08));border-color:rgba(229,192,114,.5);color:var(--gold2)}

/* ── cards / lists ── */
.card{border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(165deg,rgba(255,255,255,.045),rgba(255,255,255,.012));overflow:hidden}
.card>h3{font-size:13.5px;font-weight:700;padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.card>h3 .hint{margin-inline-start:auto;font-size:11.5px;color:var(--dim2);font-weight:500}
.pad{padding:14px 16px}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.045);cursor:pointer;transition:.15s}
.row:last-child{border-bottom:none}
.row:active{background:rgba(255,255,255,.04)}
.av{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:14px;font-weight:800;flex:0 0 auto;
 background:linear-gradient(150deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1px solid var(--line)}
.av.gold{color:var(--gold);border-color:rgba(229,192,114,.35);background:linear-gradient(150deg,rgba(229,192,114,.20),rgba(229,192,114,.04))}
.av.blue{color:var(--blue);border-color:rgba(106,168,255,.3);background:linear-gradient(150deg,rgba(106,168,255,.18),rgba(106,168,255,.03))}
.av.violet{color:var(--violet);border-color:rgba(169,139,255,.3);background:linear-gradient(150deg,rgba(169,139,255,.18),rgba(169,139,255,.03))}
.av.green{color:var(--green);border-color:rgba(61,220,151,.3);background:linear-gradient(150deg,rgba(61,220,151,.18),rgba(61,220,151,.03))}
.mid{flex:1;min-width:0}
.mid b{display:block;font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid span{font-size:11.5px;color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.amt{text-align:left;font-variant-numeric:tabular-nums;font-weight:750;font-size:14px;white-space:nowrap}
.amt small{display:block;font-size:10.5px;color:var(--dim2);font-weight:500}
.chip{display:inline-block;font-size:10px;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.07);color:var(--dim);margin-top:2px}

/* ── forms ── */
label{display:block;font-size:11.5px;color:var(--dim);margin:12px 0 5px;font-weight:600;letter-spacing:.2px}
input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line2);border-radius:13px;
 color:var(--txt);padding:12px 14px;font-size:15px;font-family:inherit;outline:none;transition:.18s}
input:focus,select:focus,textarea:focus{border-color:rgba(229,192,114,.6);background:rgba(255,255,255,.075);box-shadow:0 0 0 3px rgba(229,192,114,.10)}
input::placeholder{color:var(--dim2)}
.btn{width:100%;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:750;cursor:pointer;transition:.18s;
 background:linear-gradient(150deg,var(--gold2),var(--gold));color:#241a06;box-shadow:0 10px 26px rgba(229,192,114,.22)}
.btn:active{transform:scale(.985)}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--txt);border:1px solid var(--line2);box-shadow:none}
.btn.sec{background:linear-gradient(150deg,rgba(106,168,255,.9),rgba(106,168,255,.65));color:#06101f;box-shadow:0 10px 26px rgba(106,168,255,.2)}
.btn[disabled]{opacity:.5;pointer-events:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ── states ── */
.note{border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:12.5px;color:var(--dim);
 background:rgba(255,255,255,.03);line-height:1.6}
.note.warn{border-color:rgba(255,180,80,.35);background:rgba(255,180,80,.07);color:#f0cf9a}
.note.ok{border-color:rgba(61,220,151,.3);background:rgba(61,220,151,.06);color:#a9f0cd}
.note.bad{border-color:rgba(255,107,94,.35);background:rgba(255,107,94,.07);color:#ffb3ac}
.hc{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.hc:last-child{border-bottom:none}
.hc .st{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.hc .st.g{background:var(--green);box-shadow:0 0 0 3px rgba(61,220,151,.15)}
.hc .st.r{background:var(--red);box-shadow:0 0 0 3px rgba(255,107,94,.15)}
.skel{height:74px;border-radius:14px;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04));
 background-size:200% 100%;animation:sh 1.3s infinite;margin-bottom:10px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.empty{text-align:center;color:var(--dim2);padding:34px 16px;font-size:13px}
svg.spark{width:64px;height:26px;flex:0 0 auto}

/* ── sheet ── */
.sheet{position:fixed;inset:0;z-index:90;display:none;align-items:flex-end;justify-content:center;
 background:rgba(0,0,0,.62);backdrop-filter:blur(6px)}
.sheet.on{display:flex}
.sheetin{width:100%;max-width:560px;background:linear-gradient(180deg,#12131b,#0a0b10);
 border:1px solid var(--line2);border-radius:26px 26px 0 0;padding:8px 18px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .28s cubic-bezier(.22,1,.36,1)}
@keyframes up{from{transform:translateY(26px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:44px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin:6px auto 14px}
.sheetin h2{font-size:17px;font-weight:800;margin-bottom:4px}
.sheetin .sd{font-size:12.5px;color:var(--dim);margin-bottom:6px}

/* ── toast ── */
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,24px);
 background:#15161f;border:1px solid var(--line2);color:var(--txt);padding:11px 18px;border-radius:999px;
 font-size:13px;opacity:0;pointer-events:none;transition:.26s;z-index:120;max-width:92vw;text-align:center;
 box-shadow:0 14px 40px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.ok{border-color:rgba(61,220,151,.45)} #toast.bad{border-color:rgba(255,107,94,.45)}

/* ── lock ── */
#lock{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:22px;
 background:radial-gradient(700px 460px at 50% 0%,rgba(229,192,114,.13),transparent 65%),#07070b}
#lock .box{width:100%;max-width:380px;text-align:center}
#lock .seal{width:58px;height:58px;border-radius:18px;font-size:22px;margin:0 auto 16px}
#lock h2{font-size:20px;font-weight:800;margin-bottom:6px}
#lock p{font-size:12.5px;color:var(--dim);margin-bottom:18px}
.hide{display:none!important}
@media(min-width:720px){
 .kpis{grid-template-columns:repeat(4,1fr)}
 h1{font-size:31px}
 .grid2{gap:12px}
}
@media print{body{background:#fff;color:#000}}
</style>
</head>
<body>

<div id="lock">
  <div class="box">
    <div class="seal">₪</div>
    <h2>בנק הרשת</h2>
    <p>כניסה מאובטחת. המפתח נשמר במכשיר שלך בלבד.</p>
    <input id="lockKey" type="password" placeholder="מפתח גישה" autocomplete="off">
    <div style="height:12px"></div>
    <button class="btn" id="lockGo">כניסה</button>
    <div id="lockErr" class="note bad hide" style="margin-top:12px">המפתח שגוי</div>
  </div>
</div>

<header class="top">
  <div class="topin">
    <div class="brand">
      <div class="seal">₪</div>
      <div><b>בנק הרשת</b><span>שימי · ניהול כספים</span></div>
    </div>
    <div class="spacer"></div>
    <span class="pill" id="livePill"><span class="dot"></span><span id="liveTxt">מחובר</span></span>
    <button class="iconbtn" id="btnRefresh" title="רענון" aria-label="רענון">⟳</button>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <div class="eyebrow">Financial Console</div>
    <h1>הכל במקום אחד. <em>מדויק.</em></h1>
    <div class="sub" id="subline">טוען נתונים…</div>
  </section>

  <div class="kpis" id="kpis">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab on" data-t="overview">סקירה</button>
    <button class="tab" data-t="accounts">חשבונות</button>
    <button class="tab" data-t="tx">תנועות</button>
    <button class="tab" data-t="invoices">חשבוניות</button>
    <button class="tab" data-t="collect">גבייה</button>
    <button class="tab" data-t="links">חיבורים</button>
  </div>

  <div id="view" style="margin-top:14px"></div>
</main>

<div class="sheet" id="sheet"><div class="sheetin">
  <div class="grab"></div>
  <h2 id="shTitle"></h2>
  <div class="sd" id="shDesc"></div>
  <div id="shBody"></div>
</div></div>

<div id="toast"></div>

<script>
(()=>{
'use strict';
const API='https://base44.app/api/apps/6a901f55a4d9a9b76a095a77/functions/bankApi';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let KEY=localStorage.getItem('bank_key')||'';
let DATA=null, TAB='overview';

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=n=>Number(n||0).toLocaleString('he-IL',{minimumFractionDigits:2,maximumFractionDigits:2});
const nf0=n=>Number(n||0).toLocaleString('he-IL',{maximumFractionDigits:0});
const curSym=c=>c==='ILS'?'₪':c;
function ago(iso){ if(!iso) return '—'; const d=(Date.now()-new Date(iso).getTime())/1000;
  if(d<60) return 'עכשיו'; if(d<3600) return Math.floor(d/60)+' דק׳'; if(d<86400) return Math.floor(d/3600)+' שע׳';
  return Math.floor(d/86400)+' ימים'; }
function toast(msg,kind){ const t=$('#toast'); t.textContent=msg; t.className='on '+(kind||''); clearTimeout(t._x);
  t._x=setTimeout(()=>{t.className=''},2800); }

async function api(action,extra={}){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-waba-key':KEY},body:JSON.stringify({action,...extra})});
  if(r.status===401){ lockShow(); throw new Error('unauthorized'); }
  return r.json().catch(()=>({ok:false,error:'bad_response'}));
}

/* ── lock ── */
function lockShow(){ $('#lock').classList.remove('hide'); }
$('#lockGo').addEventListener('click',async()=>{
  const v=$('#lockKey').value.trim(); if(!v) return;
  KEY=v; $('#lockErr').classList.add('hide');
  try{ const d=await api('summary'); if(!d.ok) throw new Error(d.error||'x');
    localStorage.setItem('bank_key',v); $('#lock').classList.add('hide'); paint(d); }
  catch(e){ $('#lockErr').classList.remove('hide'); }
});
$('#lockKey').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#lockGo').click(); });

/* ── refresh ── */
let busy=false;
async function load(silent){
  if(busy) return; busy=true;
  $('#btnRefresh').classList.add('busy'); $('#btnRefresh').firstChild.textContent='⟳';
  $('#btnRefresh').classList.add('spin');
  try{
    const d=await api('summary');
    if(!d.ok) throw new Error(d.error||'שגיאה');
    DATA=d; paint(d); if(!silent) toast('הנתונים עודכנו','ok');
  }catch(e){
    if(String(e.message)!=='unauthorized'){ toast('הרענון נכשל: '+e.message,'bad');
      $('#livePill').innerHTML='<span class="dot" style="background:#ff6b5e"></span><span>לא זמין</span>'; }
  }finally{
    busy=false; $('#btnRefresh').classList.remove('busy','spin');
  }
}
$('#btnRefresh').addEventListener('click',()=>load(false));
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && DATA && (Date.now()-new Date(DATA.generated_at).getTime())>45000) load(true); });

/* ── render ── */
function paint(d){
  $('#lock').classList.add('hide');
  $('#subline').textContent='עודכן '+ago(d.generated_at)+' · '+d.accounts_count+' חשבונות · '+nf0(d.scanned)+' תנועות';
  $('#liveTxt').textContent='מחובר';
  const ils=d.totals.ILS||0;
  const kpi=[
    {l:'יתרת שקלים',v:nf(ils),s:'₪',f:(d.month.in-d.month.out>=0?'<span class="up">+':'<span class="down">')+nf(d.month.in-d.month.out)+' ₪ החודש</span>'},
    {l:'הכנסות החודש',v:nf(d.month.in),s:'₪',f:d.month.tx+' תנועות בסה"כ'},
    {l:'יתרת SGC',v:nf(d.totals.SGC||0),s:'SGC',f:'מטבע הרשת הפנימי'},
    {l:'חשבוניות',v:nf0(d.invoices.count),s:'',f:'הונפקו '+nf(d.invoices.issued_total)+' ₪ · '+d.invoices.draft+' טיוטות'},
  ];
  $('#kpis').innerHTML=kpi.map(k=>`<div class="kpi"><div class="lbl">${k.l}</div>
    <div class="val">${k.v}${k.s?'<small>'+k.s+'</small>':''}</div><div class="foot">${k.f}</div></div>`).join('');
  render();
}

function sparkline(vals){
  if(!vals||vals.length<2) return '';
  const w=64,h=26,min=Math.min(...vals),max=Math.max(...vals),rng=(max-min)||1;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1))*w},${h-((v-min)/rng)*(h-4)-2}`).join(' ');
  const up=vals[vals.length-1]>=vals[0];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="${up?'#3ddc97':'#ff6b5e'}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/></svg>`;
}

function render(){
  if(!DATA) return;
  const v=$('#view'); const d=DATA;
  if(TAB==='overview'){
    const recent=d.recent.slice(0,12).map(t=>rowTx(t)).join('')||empty('אין תנועות עדיין');
    const top=d.accounts.filter(a=>!a.is_test).slice(0,5).map(a=>rowAcc(a)).join('')||empty('אין חשבונות');
    v.innerHTML=`
      <div class="card" style="margin-bottom:12px"><h3>תנועות אחרונות<span class="hint">${d.scanned} רשומות</span></h3><div class="list">${recent}</div></div>
      <div class="card"><h3>חשבונות מובילים<span class="hint">${d.accounts_count} סה"כ</span></h3><div class="list">${top}</div></div>`;
    bindRows();
  }
  if(TAB==='accounts'){
    const rows=d.accounts.map(a=>rowAcc(a)).join('')||empty('אין חשבונות');
    v.innerHTML=`<div class="card"><h3>כל החשבונות<span class="hint">${d.accounts_count}</span></h3><div class="list">${rows}</div></div>`;
    bindRows();
  }
  if(TAB==='tx'){
    v.innerHTML=`<div class="card"><h3>ספר התנועות<span class="hint">${d.scanned} רשומות</span></h3>
      <div class="pad"><input id="txq" placeholder="חיפוש בתיאור, חשבון או קטגוריה"></div>
      <div class="list" id="txlist">${d.recent.map(t=>rowTx(t)).join('')||empty('אין תנועות')}</div></div>`;
    const q=$('#txq');
    q.addEventListener('input',()=>{
      const s=q.value.trim().toLowerCase();
      const f=d.recent.filter(t=>!s||JSON.stringify(t).toLowerCase().includes(s));
      $('#txlist').innerHTML=f.map(t=>rowTx(t)).join('')||empty('לא נמצאו תנועות');
    });
    bindRows();
  }
  if(TAB==='invoices'){ loadInvoices(); }
  if(TAB==='collect'){ renderCollect(); }
  if(TAB==='links'){ renderLinks(); }
}
const empty=m=>`<div class="empty">${m}</div>`;

function rowTx(t){
  const inc=t.dir==='in';
  const sign=inc?'+':'−';
  const cls=inc?'green':'gold';
  const catName={bit:'ביט',card:'אשראי',paypal:'PayPal',transfer:'העברה',salary:'משכורת',commission:'עמלה',manual:'ידני'}[t.category]||t.category||'';
  return `<div class="row" data-acc="${esc(t.account)}">
    <div class="av ${cls}">${inc?'↓':'↑'}</div>
    <div class="mid"><b>${esc(t.desc||'תנועה')}</b>
      <span>${esc(t.account)} · ${ago(t.date)} · ${catName}</span></div>
    <div class="amt ${inc?'up':'down'}">${sign}${nf(t.amount)}
      <small>${nf(t.after)} ${curSym(t.currency)}</small></div></div>`;
}

function rowAcc(a){
  return `<div class="row" data-acc="${esc(a.key)}">
    <div class="av ${a.currency==='ILS'?'green':a.currency==='SGC'?'gold':'violet'}">${esc((a.name||'?').slice(0,2))}</div>
    <div class="mid"><b>${esc(a.name)}</b><span>${esc(a.key)} · ${a.tx_count} תנועות${a.is_test?' · בדיקות':''}</span></div>
    ${sparkline(a.spark)}
    <div class="amt">${nf(a.balance)}<small>${curSym(a.currency)}</small></div></div>`;
}

function bindRows(){
  $$('#view .row[data-acc]').forEach(el=>el.addEventListener('click',()=>openAccount(el.dataset.acc)));
}

/* ── account sheet ── */
async function openAccount(k){
  sheet('חשבון '+k,'טוען…','<div class="skel"></div><div class="skel"></div>');
  const d=await api('account',{account_key:k});
  if(!d.ok){ $('#shBody').innerHTML=`<div class="note bad">${esc(d.error)}</div>`; return; }
  const txs=d.txs.map(t=>`<div class="row" style="padding:10px 0">
    <div class="av ${t.dir==='in'?'green':'gold'}" style="width:34px;height:34px;border-radius:11px;font-size:12px">${t.dir==='in'?'↓':'↑'}</div>
    <div class="mid"><b>${esc(t.desc||'תנועה')}</b><span>${new Date(t.date).toLocaleDateString('he-IL')} · ${esc(t.category)}</span></div>
    <div class="amt ${t.dir==='in'?'up':'down'}">${t.dir==='in'?'+':'−'}${nf(t.amount)}<small>${nf(t.after)}</small></div></div>`).join('')||empty('אין תנועות');
  $('#shDesc').textContent='יתרה '+nf(d.balance);
  $('#shBody').innerHTML=`<div class="list">${txs}</div>`;
}

/* ── invoices ── */
async function loadInvoices(){
  const v=$('#view');
  v.innerHTML=`<div class="skel"></div><div class="skel"></div>`;
  const d=await api('invoices');
  if(!d.ok){ v.innerHTML=`<div class="note bad">${esc(d.error)}</div>`; return; }
  const rows=d.invoices.map(i=>`<div class="row" data-inv="${esc(i.id)}">
    <div class="av ${i.status==='issued'?'green':'gold'}">${i.status==='issued'?'✓':'✎'}</div>
    <div class="mid"><b>${esc(i.customer||'ללא שם')}</b><span>${esc(i.number||'טיוטה')} · ${esc(i.date)} · ${esc(i.description||'')}</span></div>
    <div class="amt">${nf(i.amount)}<small>₪</small></div></div>`).join('')||empty('עוד לא הונפקו חשבוניות');
  v.innerHTML=`<div class="card"><h3>חשבוניות<span class="hint">${d.count}</span></h3>
    <div class="pad"><button class="btn" id="btnNewInv">+ חשבונית חדשה</button></div>
    <div class="list">${rows}</div></div>`;
  $('#btnNewInv').addEventListener('click',newInvoiceSheet);
  $$('#view .row[data-inv]').forEach(el=>el.addEventListener('click',()=>{
    location.href='/bank/invoice/?id='+encodeURIComponent(el.dataset.inv);
  }));
}

function newInvoiceSheet(pre){
  pre=pre||{};
  sheet('חשבונית חדשה','ממלאים פעם אחת, מקבלים מסמך מוכן','',`
    <label>שם הלקוח</label><input id="ivName" value="${esc(pre.customer_name||'')}" placeholder="שם מלא / חברה">
    <label>סכום לתשלום (₪, כולל מע"מ)</label><input id="ivAmt" inputmode="decimal" value="${pre.amount||''}" placeholder="0.00">
    <label>תיאור</label><input id="ivDesc" value="${esc(pre.description||'שירותי רשת שימי')}">
    <div class="grid2">
      <div><label>טלפון</label><input id="ivPhone" value="${esc(pre.customer_phone||'')}" inputmode="tel" placeholder="050…"></div>
      <div><label>ח.פ / ת.ז</label><input id="ivTax" value="${esc(pre.customer_tax_id||'')}" placeholder="אופציונלי"></div>
    </div>
    <label>אמצעי תשלום</label><select id="ivPay"><option value="">—</option><option>אשראי</option><option>ביט</option><option>PayPal</option><option>העברה בנקאית</option><option>מזומן</option></select>
    <div style="height:16px"></div>
    <button class="btn" id="ivGo">יצירת חשבונית</button>
    <div id="ivMsg" style="margin-top:10px"></div>`);
  $('#ivGo').addEventListener('click',async()=>{
    const btn=$('#ivGo'); btn.disabled=true; btn.textContent='יוצר…';
    const payload={customer_name:$('#ivName').value.trim(),amount:Number($('#ivAmt').value),
      description:$('#ivDesc').value.trim(),customer_phone:$('#ivPhone').value.trim(),
      customer_tax_id:$('#ivTax').value.trim(),payment_method:$('#ivPay').value};
    if(!payload.customer_name||!(payload.amount>0)){
      $('#ivMsg').innerHTML='<div class="note bad">צריך שם לקוח וסכום גדול מאפס</div>';
      btn.disabled=false; btn.textContent='יצירת חשבונית'; return;
    }
    const d=await api('invoice_create',payload);
    if(d.ok){ toast('החשבונית נוצרה','ok'); location.href='/bank/invoice/?id='+encodeURIComponent(d.id); }
    else{ $('#ivMsg').innerHTML='<div class="note bad">'+esc(d.error)+'</div>'; btn.disabled=false; btn.textContent='יצירת חשבונית'; }
  });
}

/* ── collect (Grow) ── */
function renderCollect(){
  const v=$('#view');
  v.innerHTML=`<div class="card"><h3>גבייה בכרטיס · Grow</h3>
    <div class="pad">
      <div class="note" id="growState">בודק חיבור…</div>
      <label>סכום לחיוב (₪)</label><input id="cAmt" inputmode="decimal" placeholder="0.00">
      <div class="grid2">
        <div><label>שם מלא</label><input id="cName" placeholder="שם פרטי ומשפחה"></div>
        <div><label>נייד</label><input id="cPhone" inputmode="tel" placeholder="0500000000"></div>
      </div>
      <label>תיאור</label><input id="cDesc" value="תשלום לרשת שימי">
      <div style="height:14px"></div>
      <button class="btn" id="cGo">יצירת קישור תשלום</button>
      <div id="cOut" style="margin-top:12px"></div>
      <div style="height:14px"></div>
      <button class="btn ghost" id="cPaypal">גיבוי: PayPal</button>
    </div></div>`;
  api('health').then(d=>{
    const g=(d.checks||[]).find(c=>c.id==='grow');
    const el=$('#growState'); if(!g||!el) return;
    el.className='note '+(g.ok?'ok':'bad');
    el.innerHTML=(g.ok?'החיבור ל-Grow מאומת. ':'Grow לא זמין. ')+(g.warn?esc(g.warn):esc(g.detail||''));
  });
  $('#cGo').addEventListener('click',async()=>{
    const btn=$('#cGo'); btn.disabled=true; btn.textContent='יוצר…';
    const d=await api('charge',{amount:Number($('#cAmt').value),customer_name:$('#cName').value.trim(),
      customer_phone:$('#cPhone').value.trim(),description:$('#cDesc').value.trim()});
    if(d.ok&&d.payment_url){
      $('#cOut').innerHTML=`<div class="note ok">קישור התשלום מוכן:<br><a href="${esc(d.payment_url)}" target="_blank" style="color:#a9f0cd;word-break:break-all">${esc(d.payment_url)}</a></div>`;
      toast('קישור תשלום נוצר','ok');
    }else{
      const msg=typeof d.error==='object'?(d.error.message||JSON.stringify(d.error)):(d.error||'שגיאה');
      $('#cOut').innerHTML=`<div class="note bad">Grow החזיר: ${esc(msg)}</div>
        <div class="note warn" style="margin-top:8px">אבחון: המפתח מאומת מול Grow, אבל דף הסליקה המבוקש דוחה את הסכום. נדרש קוד דף סליקה פעיל מדשבורד Grow (הגדרות · דפי סליקה).</div>`;
    }
    btn.disabled=false; btn.textContent='יצירת קישור תשלום';
  });
  $('#cPaypal').addEventListener('click',()=>window.open('https://www.paypal.com/paypalme/shiminetwork','_blank'));
}

/* ── links / health ── */
function renderLinks(){
  const v=$('#view');
  v.innerHTML=`<div class="card" style="margin-bottom:12px"><h3>בריאות המערכת</h3>
    <div class="pad" id="healthBox"><div class="skel"></div></div></div>
    <div class="card" style="margin-bottom:12px"><h3>דף סליקה · Grow</h3><div class="pad">
      <div class="note" id="pgState">קוד הדף הנוכחי נטען מהשרת.</div>
      <div class="grid2">
        <div><label>קוד דף סליקה</label><input id="pgCode" inputmode="numeric" value="105238" placeholder="105238"></div>
        <div><label>מזהה עסק (userId)</label><input id="pgUser" inputmode="numeric" value="10623857" placeholder="10623857"></div>
      </div>
      <div style="height:12px"></div>
      <button class="btn sec" id="pgGo">שמור ובדוק מול Grow</button>
      <div id="pgOut" style="margin-top:10px"></div>
    </div></div>
    <div class="card"><h3>חיבור חשבון חדש</h3><div class="pad">
      <div class="note">פותח חשבון פנימי בספר. חשבונות אשראי ובנק מתחברים בפועל דרך קליטת ההתראות.</div>
      <label>שם הבעלים</label><input id="nOwner" placeholder="לדוגמה: קרן שיווק">
      <div class="grid2">
        <div><label>מטבע</label><select id="nCur"><option>ILS</option><option>SGC</option><option>BTC</option><option>AGC</option></select></div>
        <div><label>סוג</label><select id="nKind"><option value="bank">בנק</option><option value="card">כרטיס</option><option value="wallet">ארנק</option><option value="crypto">קריפטו</option></select></div>
      </div>
      <label>הערה</label><input id="nNote" placeholder="אופציונלי">
      <div style="height:14px"></div>
      <button class="btn" id="nGo">פתיחת חשבון</button>
    </div></div>`;
  api('health').then(d=>{
    const box=$('#healthBox'); if(!box) return;
    box.innerHTML=(d.checks||[]).map(c=>`<div class="hc"><span class="st ${c.ok?'g':'r'}"></span>
      <div class="mid"><b>${esc(c.name)}</b><span>${esc(c.warn||c.detail||'')}</span></div></div>`).join('')
      +`<div class="note" style="margin-top:10px">בדיקה ארכה ${d.ms||0} מ״ש</div>`;
  });
  api('health').then(d=>{ /* קיים */ });
  const pgGo=$('#pgGo');
  if(pgGo) pgGo.addEventListener('click',async()=>{
    pgGo.disabled=true; pgGo.textContent='בודק…';
    const d=await api('grow_page',{page_code:$('#pgCode').value.trim(),user_id:$('#pgUser').value.trim()});
    if(d.ok&&d.auth_ok){
      $('#pgOut').innerHTML='<div class="note ok">קוד הדף נקלט ואומת מול Grow ('+esc(d.page_code)+').</div>';
      toast('דף הסליקה עודכן','ok');
    }else if(d.ok){
      $('#pgOut').innerHTML='<div class="note warn">הקוד נשמר אבל Grow לא אישר אותו: '+esc(d.detail||'ללא פירוט')+'</div>';
    }else{
      $('#pgOut').innerHTML='<div class="note bad">לא נשמר: '+esc(d.error||'שגיאה')+'</div>';
    }
    pgGo.disabled=false; pgGo.textContent='שמור ובדוק מול Grow';
  });
  $('#nGo').addEventListener('click',async()=>{
    const btn=$('#nGo'); btn.disabled=true; btn.textContent='פותח…';
    const d=await api('connect',{owner_name:$('#nOwner').value.trim(),currency:$('#nCur').value,kind:$('#nKind').value,notes:$('#nNote').value.trim()});
    btn.disabled=false; btn.textContent='פתיחת חשבון';
    if(d.ok){ toast('החשבון נפתח','ok'); await load(true); renderLinks(); }
    else toast('לא נפתח: '+esc(d.error),'bad');
  });
}

/* ── sheet helpers ── */
function sheet(title,desc,loading,html){
  $('#shTitle').textContent=title; $('#shDesc').textContent=desc||'';
  $('#shBody').innerHTML=html!==undefined?html:'<div class="skel"></div>';
  $('#sheet').classList.add('on');
}
$('#sheet').addEventListener('click',e=>{ if(e.target.id==='sheet') $('#sheet').classList.remove('on'); });

/* ── tabs ── */
$$('#tabs .tab').forEach(t=>t.addEventListener('click',()=>{
  $$('#tabs .tab').forEach(x=>x.classList.remove('on')); t.classList.add('on'); TAB=t.dataset.t; render();
}));

/* ── boot ── */
(async function boot(){
  if(!KEY){ lockShow(); return; }
  await load(true);
})();
})();
</script>
</body>
</html>
